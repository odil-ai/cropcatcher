[project]
name = "cropcatcher"
version = "0.0.2"
description = "CropCatcher: locate a query image inside candidate images using classical local feature matching algorithms, with IIIF support."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Lucas Terriel" },
    { name = "École nationale des chartes - PSL" }
]
keywords = ["computer-vision", "image-processing", "feature-extraction", "digital-humanities", "iiif"]
requires-python = ">=3.13"
dependencies = [
    "opencv-contrib-python-headless>=4.9,<5",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/odil-ai/cropcatcher/"
Repository = "https://github.com/odil-ai/cropcatcher/"
Documentation = "odil-ai.github.io/cropcatcher/"
Issues = "https://github.com/odil-ai/cropcatcher/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "matplotlib>=3.9",
    "pandas>=3.0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cropcatcher"]

[tool.hatch.build.targets.sdist]
include = [
    "cropcatcher",
    "tests",
    "scripts",
    "README.md",
    "LICENSE.md",
    "CITATION.cff",
    "pyproject.toml",
]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP009"]

[tool.ruff.lint.isort]
known-first-party = ["cropcatcher"]
